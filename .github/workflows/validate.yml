name: Validate CyberShield release

on:
  push:
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m compileall -q app api
      - name: Verify canonical entrypoints
        run: |
          test -f app/main.py
          test -f api/index.py
          test ! -f server/main.py
          ! grep -R 'server\.main' -n pyproject.toml vercel.json api app
